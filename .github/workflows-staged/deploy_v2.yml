# ─────────────────────────────────────────────────────────────────────────────
# 대기 중인 워크플로(비활성). GitHub 는 .github/workflows/ 만 읽으므로 이 파일은 실행되지 않는다.
# 메인(v2) 공개 날: 이 파일로 .github/workflows/deploy.yml 을 교체 → 로컬 확인 → main push.
# 조립 절차는 tools/redesign/build_site_v2.sh 와 같다(로컬에서 먼저 같은 결과를 확인할 수 있게).
# 구버전: 현재 deploy.yml 의 v1 조립(dashboard/ + 엔진·데이터 + version.json + __BUILD_VERSION__ 치환)을 _site/v1/ 에 그대로 수행.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 진행 중 Pages 배포를 취소하면 게시가 stuck될 수 있어 false (GitHub 권장)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble static site (v2 frontend + v1 at v1/ + lounge gate + Python engine + data)
        run: bash tools/redesign/build_site_v2.sh _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
